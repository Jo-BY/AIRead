services:
  - type: web
    name: airead
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /var/data
      - key: TEACHER_PASSWORD
        generateValue: true
    disks:
      - name: airead-data
        mountPath: /var/data
        sizeGB: 1
