services:
  - type: web
    name: airead
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /tmp/airead-data
      - key: TEACHER_PASSWORD
        generateValue: true
