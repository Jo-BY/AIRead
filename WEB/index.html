<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRead 문해력 놀이터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="sky"></div>
    <header class="gnb-wrap">
      <div class="gnb-inner">
        <div class="brand">AIRead</div>
        <nav class="gnb-menu" aria-label="상단 메뉴">
          <button type="button" class="gnb-btn active" data-view="dashboard">내 대시보드</button>
          <button type="button" class="gnb-btn" data-view="evaluation">문해력 평가</button>
        </nav>
        <div class="gnb-right">
          <span id="loginStatus" class="login-mini"></span>
          <button id="logoutButton" type="button" class="small-btn">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="container">
      <header class="hero">
        <h1>AIRead 문해력 놀이터</h1>
        <p>로그인한 내 기록을 보고, 새 감상문으로 문해력을 성장시켜요.</p>
      </header>

      <section class="panel view-panel active" id="view-dashboard">
        <div class="dashboard-header">
          <h2>내 대시보드</h2>
          <button id="refreshButton" class="small-btn" type="button">새로고침</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>책</th>
                <th>총점</th>
                <th>평가 요약</th>
                <th>제출일</th>
              </tr>
            </thead>
            <tbody id="dashboardBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel view-panel" id="view-evaluation">
        <h2>문해력 평가</h2>
        <form id="submissionForm">
          <div class="grid-2">
            <label>
              책 제목
              <input name="bookTitle" required placeholder="예: 마당을 나온 암탉" />
            </label>
            <label>
              저자(선택)
              <input name="bookAuthor" placeholder="예: 황선미" />
            </label>
            <label class="wide">
              감상문
              <textarea
                name="reflectionText"
                rows="7"
                required
                placeholder="책의 내용, 인상 깊은 장면, 왜 그렇게 느꼈는지, 내가 배운 점을 적어보세요."
              ></textarea>
            </label>
          </div>

          <button type="submit" class="rainbow-btn">평가하고 저장하기</button>
        </form>

        <div class="result-panel" id="resultPanel">
          <h2>평가 결과</h2>
          <div class="score-badge"><span id="totalScore">-</span>점</div>
          <div id="scoreRows"></div>
        </div>

        <div class="indicator-box">
          <h2>문해력 평가지표</h2>
          <ul id="indicatorList"></ul>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
